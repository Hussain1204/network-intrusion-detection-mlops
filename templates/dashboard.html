<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Security Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 1rem;
        background: #f4f7fb;
        color: #1d2a35;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      }
      h1 {
        margin-top: 0;
      }
      input[type="file"], button {
        margin-top: 0.8rem;
        display: block;
      }
      button {
        background: #1d4ed8;
        color: white;
        border: none;
        padding: 0.7rem 1.2rem;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #163db5;
      }
      pre {
        white-space: pre-wrap;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem;
        border-radius: 8px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Network Security Prediction Dashboard</h1>
      <p>Upload a CSV file with the same feature columns used during training.</p>

      <form id="predictForm">
        <input id="fileInput" type="file" name="file" accept=".csv" />
        <button type="submit">Predict</button>
      </form>

      <pre id="result">Results will appear here.</pre>
    </div>

    <script>
      const form = document.getElementById("predictForm");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (!file) {
          result.textContent = "Please choose a CSV file first.";
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData,
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "Prediction request failed.");
          }
          result.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          result.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
